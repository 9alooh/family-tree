<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>شجرة العائلة — النجار</title>
    <meta name="description" content="شجرة عائلة النجار - بحث أكاديمي" />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="script.js"></script>

    <!-- ★ SMART AUTO-ZOOM LIMITER ★ -->
    <script>
      (function() {
        let isSystemZooming = false;

        // 1. When you click ANY button (like "Expand All"), allow the script to clamp the automatic zoom for 1.5 seconds.
        window.addEventListener('mousedown', function() {
          isSystemZooming = true;
          setTimeout(function() { isSystemZooming = false; }, 1500);
        }, true);

        // 2. If you use your mouse wheel or fingers, YOU are in control! Turn off the clamp.
        window.addEventListener('wheel', function() { isSystemZooming = false; }, { passive: true, capture: true });
        window.addEventListener('touchmove', function() { isSystemZooming = false; }, { passive: true, capture: true });

        // 3. The observer that actually stops the automatic shrinking
        const observer = new MutationObserver(function(mutations) {
          if (!isSystemZooming) return; // If you are doing it by hand, let it happen normally!

          mutations.forEach(function(mutation) {
            const target = mutation.target;
            
            // Fix CSS styles (React inline styles)
            if (target.style && target.style.transform) {
              let t = target.style.transform;
              if (t.includes('scale(')) {
                let scaleVal = parseFloat(t.match(/scale\(([^)]+)\)/)[1]);
                if (scaleVal < 0.4) {
                  // If the system tries to shrink below 40%, force it back to 40%
                  target.style.transform = t.replace(/scale\([^)]+\)/g, 'scale(0.4)');
                }
              }
            }
            
            // Fix SVG attributes (D3/SVG graphs)
            if (target.hasAttribute && target.hasAttribute('transform')) {
              let t = target.getAttribute('transform');
              if (t.includes('scale(')) {
                let scaleVal = parseFloat(t.match(/scale\(([^)]+)\)/)[1]);
                if (scaleVal < 0.4) {
                  // If the system tries to shrink below 40%, force it back to 40%
                  target.setAttribute('transform', t.replace(/scale\([^)]+\)/g, 'scale(0.4)'));
                }
              }
            }
          });
        });

        // 4. Start watching the tree a moment after the page loads
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root) {
            observer.observe(root, { 
              attributes: true, 
              subtree: true, 
              attributeFilter: ['style', 'transform'] 
            });
          }
        }, 1000);
      })();
    </script>
    <!-- ★ END SMART AUTO-ZOOM LIMITER ★ -->
  </body>
</html>
